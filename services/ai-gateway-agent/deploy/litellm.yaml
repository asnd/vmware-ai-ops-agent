# Minimal LiteLLM proxy config used by docker-compose. Replace the model list
# with whatever your gateway actually fronts.
model_list:
  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

general_settings:
  master_key: os.environ/LLM_GATEWAY_API_KEY
