# CI for the ai-gateway-agent microservice.
#
# Scoped to services/ai-gateway-agent/ so it stays independent of the root
# package's own workflow (.github/workflows/ci.yml), which is limited to
# main/master/develop and never runs on this path.

name: ai-gateway-agent

on:
  push:
    branches: [main, master, develop, "claude/**"]
    paths:
      - "services/ai-gateway-agent/**"
      # The workflow file itself, so a change to CI is validated by CI.
      - ".github/workflows/ai-gateway-agent.yml"
  pull_request:
    branches: [main, master, develop]
    paths:
      - "services/ai-gateway-agent/**"
      - ".github/workflows/ai-gateway-agent.yml"
  workflow_dispatch:

env:
  PYTHONUNBUFFERED: "1"
  PYTHON_VERSION: "3.11"

defaults:
  run:
    working-directory: services/ai-gateway-agent

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: services/ai-gateway-agent/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: services/ai-gateway-agent/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Not continue-on-error: the service is mypy-clean and stays that way.
      - name: MyPy
        run: mypy src/

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: services/ai-gateway-agent/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Pytest
        run: pytest -v --tb=short --cov=src/aigw --cov-report=term --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-gateway-agent-coverage
          path: services/ai-gateway-agent/coverage.xml
          retention-days: 14

  validate-config:
    name: Validate shipped config
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: services/ai-gateway-agent/pyproject.toml

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install .

      # Both shipped configs must parse and their prompt templates must compile.
      - name: Validate config.yaml
        run: aigw validate --config config/config.yaml

      - name: Validate config.example.yaml
        run: aigw validate --config config/config.example.yaml

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ai-gateway-agent:ci .

      - name: Image runs and reports its config
        run: docker run --rm ai-gateway-agent:ci validate
