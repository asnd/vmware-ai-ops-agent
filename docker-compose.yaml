version: "3.8"

services:
  vmware-ai-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vmware-ai-agent
    restart: unless-stopped
    ports:
      - "9090:9090"  # Prometheus metrics
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - VMWARE_AI_VROPS__HOST=${VROPS_HOST:-vrops.example.com}
      - VMWARE_AI_VROPS__USERNAME=${VROPS_USERNAME}
      - VMWARE_AI_VROPS__PASSWORD=${VROPS_PASSWORD}
      - VMWARE_AI_VRLI__HOST=${VRLI_HOST:-vrli.example.com}
      - VMWARE_AI_VRLI__USERNAME=${VRLI_USERNAME}
      - VMWARE_AI_VRLI__PASSWORD=${VRLI_PASSWORD}
      - VMWARE_AI_VCENTER__HOST=${VCENTER_HOST:-vcenter.example.com}
      - VMWARE_AI_VCENTER__USERNAME=${VCENTER_USERNAME}
      - VMWARE_AI_VCENTER__PASSWORD=${VCENTER_PASSWORD}
      - VMWARE_AI_LLM__ENDPOINT=${LLM_ENDPOINT:-http://lightllm:8000/v1}
      - VMWARE_AI_LLM__API_KEY=${LLM_API_KEY}
    networks:
      - vmware-ai-network
    depends_on:
      - chromadb
      - lightllm
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  chromadb:
    image: chromadb/chroma:latest
    container_name: vmware-ai-chromadb
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    environment:
      - CHROMA_SERVER_AUTH_PROVIDER=
      - ANONYMIZED_TELEMETRY=False
    networks:
      - vmware-ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3

  lightllm:
    image: ghcr.io/modelfamily/lightllm:latest
    container_name: vmware-ai-lightllm
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ${MODEL_PATH:-./models}:/models
    environment:
      - MODEL_PATH=/models/${MODEL_NAME:-mistral-7b-instruct}
      - MAX_TOTAL_TOKEN_NUM=8192
      - BATCH_MAX_TOKENS=4096
    networks:
      - vmware-ai-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  prometheus:
    image: prom/prometheus:latest
    container_name: vmware-ai-prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - vmware-ai-network

  grafana:
    image: grafana/grafana:latest
    container_name: vmware-ai-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - vmware-ai-network
    depends_on:
      - prometheus

networks:
  vmware-ai-network:
    driver: bridge

volumes:
  chromadb_data:
  prometheus_data:
  grafana_data:
